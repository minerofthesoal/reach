plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = "3.0.0"
group = "com.reachfly.serveraddon"

base {
    archivesName = "osp-server-addon"
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    // Minecraft (26.1 - unobfuscated, no mappings needed)
    minecraft "com.mojang:minecraft:26.1"

    // Fabric loader and API
    implementation "net.fabricmc:fabric-loader:0.18.6"
    implementation "net.fabricmc.fabric-api:fabric-api:0.144.4+26.1"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

// === Data Pack build task ===
tasks.register('buildDatapack', Zip) {
    description = 'Builds the OSP Server Addon as a Minecraft data pack (ZIP)'
    group = 'build'

    from('datapack')
    archiveBaseName = 'osp-server-addon-datapack'
    archiveVersion = project.version
    archiveExtension = 'zip'
    destinationDirectory = file("${buildDir}/libs")
}

build.dependsOn buildDatapack
