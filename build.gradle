plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/reachfly.classtweaker")
}

dependencies {
    // Minecraft (No mappings needed for unobfuscated 26.2!)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // Fabric loader and API (use modImplementation)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Bundle Fabric API inside the JAR (Jar-in-Jar)
    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Mod Menu (compile-only soft dependency)
    modCompileOnly "maven.modrinth:modmenu:17.0.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    // Bundle the server-addon datapack into the client mod JAR
    from("server-addon/datapack/data") {
        into "data"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
