name: Build MC 26.1 / 26.1.1

on:
  push:
    branches: [ mc-26.1, 'claude/**' ]
    paths:
      - 'versions/26.1/**'
      - 'versions/26.1.1/**'
      - '.github/workflows/build-mc26.yml'
  pull_request:
    branches: [ mc-26.1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client-26-1:
    name: Build Client Mod (MC 26.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./versions/26.1/gradlew

      - name: Build client mod (MC 26.1)
        working-directory: versions/26.1
        run: |
          ./gradlew build --no-daemon --stacktrace > /tmp/build.log 2>&1 || true
          cat /tmp/build.log
          echo '## Build Output (MC 26.1)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q 'BUILD FAILED\|BUILD SUCCESSFUL' /tmp/build.log; then
            grep -q 'BUILD SUCCESSFUL' /tmp/build.log || exit 1
          else
            echo "No BUILD status found in output" && exit 1
          fi

      - name: Upload client JAR (MC 26.1)
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod-26.1
          path: versions/26.1/build/libs/*.jar
          if-no-files-found: error

  build-client-26-1-1:
    name: Build Client Mod (MC 26.1.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./versions/26.1.1/gradlew

      - name: Build client mod (MC 26.1.1)
        working-directory: versions/26.1.1
        run: |
          ./gradlew build --no-daemon --stacktrace > /tmp/build.log 2>&1 || true
          cat /tmp/build.log
          echo '## Build Output (MC 26.1.1)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q 'BUILD FAILED\|BUILD SUCCESSFUL' /tmp/build.log; then
            grep -q 'BUILD SUCCESSFUL' /tmp/build.log || exit 1
          else
            echo "No BUILD status found in output" && exit 1
          fi

      - name: Upload client JAR (MC 26.1.1)
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod-26.1.1
          path: versions/26.1.1/build/libs/*.jar
          if-no-files-found: error

  build-server-addon-26-1:
    name: Build Server Addon (MC 26.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./versions/26.1/server-addon/gradlew

      - name: Build server addon (MC 26.1)
        working-directory: versions/26.1/server-addon
        run: |
          ./gradlew build --no-daemon --stacktrace > /tmp/build.log 2>&1 || true
          cat /tmp/build.log
          echo '## Build Output (Server Addon MC 26.1)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q 'BUILD FAILED\|BUILD SUCCESSFUL' /tmp/build.log; then
            grep -q 'BUILD SUCCESSFUL' /tmp/build.log || exit 1
          else
            echo "No BUILD status found in output" && exit 1
          fi

      - name: Upload server addon mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-26.1
          path: versions/26.1/server-addon/build/libs/osp-server-addon-3.0.0.jar
          if-no-files-found: error

      - name: Upload server addon data pack
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-datapack-26.1
          path: versions/26.1/server-addon/build/libs/osp-server-addon-datapack-3.0.0.zip
          if-no-files-found: error
