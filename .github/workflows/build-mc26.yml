name: Build MC 26.1 / 26.1.1

on:
  push:
    branches: [ mc-26.1, 'claude/**' ]
    paths:
      - 'versions/26.1/**'
      - 'versions/26.1.1/**'
      - '.github/workflows/build-mc26.yml'
  pull_request:
    branches: [ mc-26.1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client-26-1:
    name: Build Client Mod (MC 26.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./versions/26.1/gradlew

      - name: Build client mod (MC 26.1)
        id: build
        working-directory: versions/26.1
        continue-on-error: true
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-client-26.1
          path: versions/26.1/build-output.log

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload client JAR (MC 26.1)
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod-26.1
          path: versions/26.1/build/libs/*.jar
          if-no-files-found: error

  build-client-26-1-1:
    name: Build Client Mod (MC 26.1.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./versions/26.1.1/gradlew

      - name: Build client mod (MC 26.1.1)
        id: build
        working-directory: versions/26.1.1
        continue-on-error: true
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-client-26.1.1
          path: versions/26.1.1/build-output.log

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload client JAR (MC 26.1.1)
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod-26.1.1
          path: versions/26.1.1/build/libs/*.jar
          if-no-files-found: error

  build-server-addon-26-1:
    name: Build Server Addon (MC 26.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./versions/26.1/server-addon/gradlew

      - name: Build server addon (MC 26.1)
        id: build
        working-directory: versions/26.1/server-addon
        continue-on-error: true
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-server-addon-26.1
          path: versions/26.1/server-addon/build-output.log

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload server addon mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-26.1
          path: versions/26.1/server-addon/build/libs/osp-server-addon-3.0.0.jar
          if-no-files-found: error

      - name: Upload server addon data pack
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-datapack-26.1
          path: versions/26.1/server-addon/build/libs/osp-server-addon-datapack-3.0.0.zip
          if-no-files-found: error
