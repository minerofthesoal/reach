name: Build & Release (MC 26.1)

on:
  push:
    branches: [ mc-26.1 ]
  pull_request:
    branches: [ mc-26.1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client:
    name: Build Client Mod (MC 26.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build client mod
        run: ./gradlew build --no-daemon

      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod-26.1
          path: build/libs/*.jar
          if-no-files-found: error

  build-server-addon:
    name: Build Server Addon (MC 26.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x server-addon/gradlew

      - name: Build server addon
        working-directory: server-addon
        run: ./gradlew build --no-daemon

      - name: Upload server addon mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-26.1
          path: server-addon/build/libs/osp-server-addon-3.0.0.jar
          if-no-files-found: error

      - name: Upload server addon data pack
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-datapack-26.1
          path: server-addon/build/libs/osp-server-addon-datapack-3.0.0.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-client, build-server-addon]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download client mod artifact
        uses: actions/download-artifact@v4
        with:
          name: reach-fly-mod-26.1
          path: artifacts/client

      - name: Download server addon mod
        uses: actions/download-artifact@v4
        with:
          name: osp-server-addon-26.1
          path: artifacts/server

      - name: Download server addon data pack
        uses: actions/download-artifact@v4
        with:
          name: osp-server-addon-datapack-26.1
          path: artifacts/datapack

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-mc26.1-build.${{ github.run_number }}
          name: "OSP v3.0.0 MC 26.1 + Server Addon v3 (Build #${{ github.run_number }})"
          body: |
            ## Downloads
            - **Client Mod (MC 26.1)** - Install in `.minecraft/mods/` (requires Fabric)
            - **Server Addon (Fabric Mod)** - Install in server `mods/` folder (requires Fabric on server)
            - **Server Addon (Data Pack)** - Install in `world/datapacks/` folder (works on ANY vanilla/Fabric/Paper server)
          files: |
            artifacts/client/*.jar
            artifacts/server/*.jar
            artifacts/datapack/*.zip
          generate_release_notes: true
