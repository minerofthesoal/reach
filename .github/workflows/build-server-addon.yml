name: Build & Release Server Addon

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'server-addon/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'server-addon/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-addon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy Gradle wrapper from root
        run: |
          cp -r ../gradle .
          cp ../gradlew .
          chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon
          path: server-addon/build/libs/*.jar
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-addon-v1.0.0-build.${{ github.run_number }}
          name: "OSP Server Addon v1.0.0 (Build #${{ github.run_number }})"
          files: server-addon/build/libs/*.jar
          generate_release_notes: true
