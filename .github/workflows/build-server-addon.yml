name: Build & Release Server Addon v3

on:
  push:
    branches: [ main, 'claude/**', 'mc-*' ]
    paths:
      - 'server-addon/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'server-addon/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x server-addon/gradlew

      - name: Build server addon (mod + datapack)
        working-directory: server-addon
        run: ./gradlew build --no-daemon

      - name: Upload Fabric mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: f1sch-server-addon-mod
          path: server-addon/build/libs/f1sch-server-addon-3.0.0.jar
          if-no-files-found: error

      - name: Upload Data Pack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: f1sch-server-addon-datapack
          path: server-addon/build/libs/f1sch-server-addon-datapack-3.0.0.zip
          if-no-files-found: error
