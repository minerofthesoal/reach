name: Build & Release

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client:
    name: Build Client Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build client mod
        run: ./gradlew build --no-daemon

      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod
          path: build/libs/*.jar
          if-no-files-found: error

  build-server-addon:
    name: Build Server Addon v3 (Mod + Datapack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x server-addon/gradlew

      - name: Build server addon (mod JAR + data pack ZIP)
        working-directory: server-addon
        run: ./gradlew build --no-daemon

      - name: Upload server addon mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-v3-mod
          path: server-addon/build/libs/osp-server-addon-3.0.0.jar
          if-no-files-found: error

      - name: Upload server addon data pack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-v3-datapack
          path: server-addon/build/libs/osp-server-addon-datapack-3.0.0.zip
          if-no-files-found: error

  build-client-26-1:
    name: Build Client Mod (MC 26.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./versions/26.1/gradlew

      - name: Build client mod (MC 26.1)
        working-directory: versions/26.1
        run: ./gradlew build --no-daemon

      - name: Upload client JAR (MC 26.1)
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod-26.1
          path: versions/26.1/build/libs/*.jar
          if-no-files-found: error

  build-client-26-1-1:
    name: Build Client Mod (MC 26.1.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./versions/26.1.1/gradlew

      - name: Build client mod (MC 26.1.1)
        working-directory: versions/26.1.1
        run: ./gradlew build --no-daemon

      - name: Upload client JAR (MC 26.1.1)
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod-26.1.1
          path: versions/26.1.1/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-client, build-server-addon, build-client-26-1, build-client-26-1-1]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download client mod artifact
        uses: actions/download-artifact@v4
        with:
          name: reach-fly-mod
          path: artifacts/client

      - name: Download server addon mod
        uses: actions/download-artifact@v4
        with:
          name: osp-server-addon-v3-mod
          path: artifacts/server

      - name: Download server addon data pack
        uses: actions/download-artifact@v4
        with:
          name: osp-server-addon-v3-datapack
          path: artifacts/datapack

      - name: Download client mod (MC 26.1)
        uses: actions/download-artifact@v4
        with:
          name: reach-fly-mod-26.1
          path: artifacts/client-26.1

      - name: Download client mod (MC 26.1.1)
        uses: actions/download-artifact@v4
        with:
          name: reach-fly-mod-26.1.1
          path: artifacts/client-26.1.1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-build.${{ github.run_number }}
          name: "OSP v2.2.0 + Server Addon v3 (Build #${{ github.run_number }})"
          body: |
            ## Downloads
            - **Client Mod (MC 1.21.11)** - Install in `.minecraft/mods/` (requires Fabric)
            - **Client Mod (MC 26.1)** - For Minecraft 26.1 (requires Fabric + Java 24)
            - **Client Mod (MC 26.1.1)** - For Minecraft 26.1.1 (requires Fabric + Java 24)
            - **Server Addon (Fabric Mod)** - Install in server `mods/` folder (requires Fabric on server)
            - **Server Addon (Data Pack)** - Install in `world/datapacks/` folder (works on ANY vanilla/Fabric/Paper server)
          files: |
            artifacts/client/*.jar
            artifacts/client-26.1/*.jar
            artifacts/client-26.1.1/*.jar
            artifacts/server/*.jar
            artifacts/datapack/*.zip
          generate_release_notes: true
