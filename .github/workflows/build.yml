name: Build & Release

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client:
    name: Build Client Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build client mod
        run: ./gradlew build --no-daemon

      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: reach-fly-mod
          path: build/libs/*.jar
          if-no-files-found: error

  build-server-addon:
    name: Build Server Addon v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x server-addon/gradlew

      - name: Build server addon
        working-directory: server-addon
        run: ./gradlew build --no-daemon

      - name: Upload server addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: osp-server-addon-v2
          path: server-addon/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-client, build-server-addon]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download client mod artifact
        uses: actions/download-artifact@v4
        with:
          name: reach-fly-mod
          path: artifacts/client

      - name: Download server addon artifact
        uses: actions/download-artifact@v4
        with:
          name: osp-server-addon-v2
          path: artifacts/server

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build.${{ github.run_number }}
          name: "OSP v2.0.0 + Server Addon v2 (Build #${{ github.run_number }})"
          files: |
            artifacts/client/*.jar
            artifacts/server/*.jar
          generate_release_notes: true
